name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Compile and interpret baseline example
        run: |
          ./build/mouz build examples/first.mozf -o build/first.mozc
          ./build/mouzi build/first.mozc
      - name: Compile and interpret expression example
        run: |
          ./build/mouz check examples/expression-state.mozf
          ./build/mouz build examples/expression-state.mozf -o build/expression-state.mozc
          ./build/mouzi build/expression-state.mozc
      - name: Compile and interpret value/state example
        run: |
          ./build/mouz check examples/state-values.mozf
          ./build/mouz build examples/state-values.mozf -o build/state-values.mozc
          ./build/mouzi build/state-values.mozc
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Mouz Windows host
        run: dotnet build platform/windows/Mouz.Windows.csproj --configuration Release
